<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TEST KAMERA</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 90vw;
      max-width: 500px;
      margin: 20px auto;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      background: white;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>

</head>

<body>

  <h1>📷 TEST KAMERA</h1>

  <div id="reader"></div>

  <div id="status">
    Kamera sedang dibuka...
  </div>


  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <script>

    let scanner = null;


    function mulaiKamera() {

      scanner = new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 100
          }

        },

        function(decodedText) {

          document.getElementById("status").innerHTML =
            "✅ BARCODE TERBACA<br><br>" +
            decodedText;

        },

        function(errorMessage) {

          // Abaikan error scan

        }

      )

      .then(function() {

        document.getElementById("status").innerHTML =
          "🟢 KAMERA AKTIF<br><br>" +
          "Arahkan ke barcode.";

      })

      .catch(function(error) {

        console.log(error);

        document.getElementById("status").innerHTML =
          "🔴 KAMERA GAGAL<br><br>" +
          error;

      });

    }


    window.addEventListener(
      "load",
      mulaiKamera
    );

  </script>

</body>
</html>
